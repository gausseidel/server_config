# Usa colori terminali veri, non imposta sfondi
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g default-shell /bin/fish

# Se hai personalizzazioni, usa anche:
set-option -g window-status-style bg=default
set-option -g status-style bg=default,fg=default
set-option -g window-status-current-style bg=default
set -g mouse on
# Supporta i movimenti da vim verso tmux
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R
